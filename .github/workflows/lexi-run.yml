name: Lexi daily run

# Scheduled execution of the knowledge-graph-agent. Per spec §8, this is the
# Phase 1→2 transition piece — Lexi goes from "Nicole-triggered batch" to
# "runs on a schedule." The forcing functions in forcing-functions.mjs are
# the safety floor: pause-on-unread and throughput caps mean an unattended
# scheduled run can't run away.

on:
  schedule:
    # 18:00 UTC daily = ~6am NZST / ~7am NZDT (gives Nicole fresh state
    # when she starts her morning). Cron is always UTC; adjust if cadence
    # or timezone changes.
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Allows manual run from the Actions tab — used for testing the
    # workflow before relying on the schedule, and for ad-hoc runs. The
    # Worker also dispatches it (no inputs) when Nicole approves by email.
    inputs:
      auto_apply_hours:
        description: "Auto-apply window for this run's digest, in hours (default 72; small values are for testing)"
        required: false
        default: ""

permissions:
  contents: write
  # Required so the workflow can push the agent's output files
  # (longlist.json, proposals.json, notes-for-nicole.json, state.json, etc.)
  # back to main. The `deploy` job at the bottom then ships them live.

concurrency:
  group: lexi-run
  cancel-in-progress: false
  # If a previous scheduled run is somehow still going when the next fires,
  # let it finish before starting another. Avoids overlapping mutations to
  # the longlist / proposals state.

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    # Raised from 15 when the reviewer pass (one Claude call per new
    # proposal) was added.
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: knowledge-graph-agent/package-lock.json

      - name: Install agent dependencies
        working-directory: knowledge-graph-agent
        run: npm ci

      - name: Run Lexi
        working-directory: knowledge-graph-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEXI_PHASE: '1'
          # Optional. If unset, the agent skips emails cleanly. run.mjs only
          # emails Nicole when there's news (new notes, or a pause).
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: node run.mjs

      - name: Scan longlist for promotion-eligible terms
        working-directory: knowledge-graph-agent
        run: node promote.mjs

      # Claude second-opinion pass over new pending proposals; sets each
      # one's review verdict and risk tier (auto / waits for Nicole).
      - name: Review proposals
        working-directory: knowledge-graph-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node review-proposals.mjs

      # Applies approvals, and first approves "auto" items whose 72h window
      # since their digest has passed (unless held or auto-apply is paused).
      - name: Apply approved proposals
        working-directory: knowledge-graph-agent
        run: node apply-proposals.mjs

      # Writes a digest to digests.json only if there's something new to
      # review. It's emailed after the push (Send digest step).
      - name: Build digest
        working-directory: knowledge-graph-agent
        env:
          LEXI_AUTO_APPLY_HOURS: ${{ inputs.auto_apply_hours }}
        run: node build-digest.mjs

      - name: Rebuild Almanac metrics
        working-directory: knowledge-graph-agent
        run: node build-almanac.mjs

      - name: Rebuild Curator's Notes
        working-directory: knowledge-graph-agent
        run: node build-curators-notes.mjs

      - name: Commit + push state changes
        id: push
        run: |
          git config user.name 'lexi-bot'
          git config user.email 'lexi-bot@users.noreply.github.com'
          # Stage every file the agent might have touched. The `|| true`
          # guards against staging errors if a file doesn't exist for some
          # reason (e.g., never been written before this run).
          git add knowledge-graph-agent/longlist.json \
                  knowledge-graph-agent/proposals.json \
                  knowledge-graph-agent/digests.json \
                  knowledge-graph-agent/notes-for-nicole.json \
                  knowledge-graph-agent/must-reads.json \
                  knowledge-graph-agent/state.json \
                  knowledge-graph-agent/agent-patch.json \
                  knowledge-graph-agent/out/latest-report.json \
                  almanac/metrics.json \
                  curators-notes/curators-notes.json \
                  almanac/history.jsonl \
                  graph-data-agent.js 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            # No [skip ci]: this workflow only triggers on `schedule` and
            # `workflow_dispatch`, so its own commit can't loop. The push
            # itself deploys nothing (GITHUB_TOKEN pushes trigger no other
            # workflows); the `deploy` job below does that.
            git commit -m "Lexi run $(date -u +%Y-%m-%d)" \
              -m "Auto-committed by .github/workflows/lexi-run.yml"
            # Defensive: remote may have moved during the run (manual pushes,
            # other workflows). Pull-rebase preferring our changes for state
            # files (-X theirs in rebase context = the commits being
            # replayed, i.e., this workflow's commit). Then push.
            git pull --rebase --strategy-option=theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # After the push: the Worker renders the digest from main, emails it,
      # and records sentAt (the auto-apply clock only counts sent digests).
      - name: Send digest
        working-directory: knowledge-graph-agent
        env:
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: node send-digest.mjs

      - name: Email Nicole on failure
        if: failure()
        env:
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: |
          if [ -n "$LEXI_NOTIFY_TOKEN" ]; then
            run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            payload=$(jq -n --arg url "$run_url" --arg wf "${{ github.workflow }}" \
              '{kind:"alert", subject:"Lexi run FAILED", intro:("Workflow \"" + $wf + "\" failed. Nothing after the failing step ran."), link:{href:$url, label:"Open the run log"}}')
            curl -sS -X POST -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $LEXI_NOTIFY_TOKEN" \
              -d "$payload" https://ai-terminology.com/api/lexi/notify || true
          fi

  # GITHUB_TOKEN pushes don't trigger push workflows (so build-stamp won't
  # run), so deploy explicitly when this run committed something.
  # always(): a failed digest send (after the push) must not leave pushed
  # state undeployed.
  deploy:
    needs: run
    if: always() && needs.run.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
