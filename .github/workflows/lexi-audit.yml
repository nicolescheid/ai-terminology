name: Lexi weekly audit

# Spec §11 establishes that the auditor runs independently from the agent,
# with a different invocation path. Here that means a separate workflow on
# its own schedule. Currently heuristic-only (no API calls); when Phase F++
# adds Claude-based second-opinion sampling, ANTHROPIC_API_KEY becomes
# required here too — for now the audit job runs without secrets.

on:
  schedule:
    # Weekly on Mondays at 19:00 UTC = ~7am NZST / ~8am NZDT Tuesdays.
    # One hour offset from the daily run so they don't overlap on the day
    # they coincide (Tuesdays in UTC).
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexi-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: knowledge-graph-agent/package-lock.json

      - name: Install agent dependencies
        working-directory: knowledge-graph-agent
        run: npm ci

      - name: Run auditor
        working-directory: knowledge-graph-agent
        env:
          # Optional. The auditor only emails Nicole when new findings land
          # (re-runs over unchanged data are silent via dedup).
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: node audit.mjs

      # "What went live this week", with an undo link per item. No email
      # if nothing was applied in the last 7 days.
      - name: Weekly what-went-live summary
        working-directory: knowledge-graph-agent
        env:
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: node weekly-summary.mjs

      - name: Rebuild Almanac metrics
        working-directory: knowledge-graph-agent
        run: node build-almanac.mjs

      - name: Commit + push new audit notes
        id: push
        run: |
          git config user.name 'lexi-bot'
          git config user.email 'lexi-bot@users.noreply.github.com'
          git add knowledge-graph-agent/notes-for-nicole.json \
                  almanac/metrics.json \
                  almanac/history.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new audit findings — dedup or no flags."
          else
            # No [skip ci]: same reasoning as lexi-run.yml. The `deploy` job
            # below ships the new findings to the live dashboard.
            git commit -m "Lexi audit $(date -u +%Y-%m-%d)" \
              -m "Auto-committed by .github/workflows/lexi-audit.yml"
            # Defensive: see lexi-run.yml — remote may have moved during run.
            git pull --rebase --strategy-option=theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Email Nicole on failure
        if: failure()
        env:
          LEXI_NOTIFY_TOKEN: ${{ secrets.LEXI_NOTIFY_TOKEN }}
        run: |
          if [ -n "$LEXI_NOTIFY_TOKEN" ]; then
            run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            payload=$(jq -n --arg url "$run_url" --arg wf "${{ github.workflow }}" \
              '{kind:"alert", subject:"Lexi audit FAILED", intro:("Workflow \"" + $wf + "\" failed. Nothing after the failing step ran."), link:{href:$url, label:"Open the run log"}}')
            curl -sS -X POST -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $LEXI_NOTIFY_TOKEN" \
              -d "$payload" https://ai-terminology.com/api/lexi/notify || true
          fi

  # GITHUB_TOKEN pushes don't trigger push workflows (so build-stamp won't
  # run), so deploy explicitly when this run committed something.
  deploy:
    needs: audit
    if: needs.audit.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
